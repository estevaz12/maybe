        Upload a zip from your Maybe data export. Categories,
        tags, merchants, and rules are imported together so references stay correct.
      family_import_monthly_planning_description:
        Upload a full Maybe data export zip. Categories are imported first (matched by name), then
        monthly planning settings and saved snapshots. Existing snapshots for this family are replaced.
      family_import_full_description:
        Upload the zip from Settings → Profile → Export data. Imports categories, tags, merchants, rules,
        monthly planning, and—if your family has no accounts yet—all accounts, transactions, trades,
        valuations, transfers, and budgets from all.ndjson. CSV files in the zip are optional; use CSV import
        if you only need accounts or transactions. Plaid-linked accounts are restored as manual accounts;
        reconnect Plaid after moving instances. If this family already has accounts, check the box below
        to delete existing accounts, entries, and budgets before importing (cannot be undone).
      family_import_replace_financial_data: Delete existing accounts, entries, and budgets before importing
      family_import_replace_financial_data_hint:
        Required when this family already has accounts. Removes all accounts (and their entries), budgets,
        and budget lines, then restores from the zip. Rules and categories from the zip are still merged first.
